name: Documentation

# Shared Zensical/Mike rendering for the fixed main branch.
on:
  push:
    branches:
      - main
      - 'publish-*'
  workflow_dispatch:
    inputs:
      ref:
        description: Optional branch or tag to rebuild
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: amwa-documentation-${{ github.repository }}
  cancel-in-progress: false

jobs:
  docs:
    uses: AMWA-TV/amwa-spec-docs/.github/workflows/docs.yml@main
    with:
      versioned: false
      site-name: ${{ github.event.repository.name }}
      public-docs-root: ${{ format('https://specs.amwa.tv/new/{0}', github.event.repository.name) }}
      source-ref: ${{ inputs.ref || github.ref_name }}
      # Pin this to a released toolkit tag or commit SHA once available.
      toolkit-ref: main
    secrets: inherit
